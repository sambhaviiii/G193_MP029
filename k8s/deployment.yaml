apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp029-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mp029-api
  template:
    metadata:
      labels:
        app: mp029-api
    spec:
      containers:
        - name: mp029-api
          image: mp029-api:1.0
          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20